services:
  openldap:
    # Self-built image (ldap-bootstrap/Dockerfile) — see its comment for why this
    # isn't osixia/openldap or bitnami/openldap.
    build: ./ldap-bootstrap
    container_name: ad-sso-poc-ldap
    environment:
      LDAP_ADMIN_PASSWORD: 'AdminPass123'
    ports:
      - '3890:389'
    healthcheck:
      test:
        [
          'CMD',
          'ldapsearch',
          '-x',
          '-H',
          'ldap://localhost:389',
          '-b',
          'dc=adsso,dc=local',
          '-D',
          'cn=admin,dc=adsso,dc=local',
          '-w',
          'AdminPass123',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: ad-sso-poc-postgres
    environment:
      POSTGRES_USER: idp
      POSTGRES_PASSWORD: idp_pw
      POSTGRES_DB: idp_sessions
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idp -d idp_sessions']
      interval: 5s
      timeout: 5s
      retries: 10
